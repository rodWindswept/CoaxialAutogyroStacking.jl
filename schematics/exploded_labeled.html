<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exploded Assembly — Autogyro Rotor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e; color: #e0e0e0;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; font-family: 'DejaVu Sans', sans-serif;
  }
  .container {
    position: relative; width: 1200px; height: 800px;
    background: #16213e; border-radius: 8px; overflow: hidden;
  }
  .container img {
    width: 100%; height: 100%; object-fit: contain;
  }
  .title {
    position: absolute; top: 20px; left: 30px;
    color: #3898EC; font-size: 24px; font-weight: bold;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
  .callout {
    position: absolute; display: flex; align-items: center;
  }
  .callout .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.7); flex-shrink: 0;
  }
  .callout .line {
    width: 40px; height: 1px; background: rgba(255,255,255,0.3);
  }
  .callout .label {
    background: rgba(0,0,0,0.82); color: #fff;
    padding: 4px 10px; border-radius: 4px; font-size: 13px;
    font-weight: bold; white-space: nowrap;
    border-left: 3px solid;
  }
</style>
</head>
<body>
<div class="container">
  <img src="renders/exploded.png" alt="">
  <div class="title">EXPLODED ASSEMBLY — Autogyro Rotor Hub</div>

  <div class="callout" style="left:540px; top:160px">
    <span class="dot"></span><span class="line"></span>
    <span class="label" style="border-color:#d4a514">Top molding</span>
  </div>
  <div class="callout" style="left:540px; top:200px">
    <span class="dot"></span><span class="line"></span>
    <span class="label" style="border-color:#bbb">Top bearing &mdash; SKF 51105</span>
  </div>
  <div class="callout" style="left:540px; top:260px">
    <span class="dot"></span><span class="line"></span>
    <span class="label" style="border-color:#888">Rotor hub &mdash; aluminium</span>
  </div>
  <div class="callout" style="left:540px; top:380px">
    <span class="dot"></span><span class="line"></span>
    <span class="label" style="border-color:#bbb">Bottom bearing</span>
  </div>
  <div class="callout" style="left:540px; top:460px">
    <span class="dot"></span><span class="line"></span>
    <span class="label" style="border-color:#d4a514">Bottom molding</span>
  </div>
  <div class="callout" style="left:540px; top:560px">
    <span class="dot"></span><span class="line"></span>
    <span class="label" style="border-color:#e54b4b">Rotor disk</span>
  </div>
</div>
</body>
</html>
