<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Autogyro Rotor Unit</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e; color: #e0e0e0;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; font-family: 'DejaVu Sans', sans-serif;
  }
  .container {
    position: relative; width: 1200px; height: 800px;
    background: #16213e; border-radius: 8px; overflow: hidden;
  }
  .container img.main {
    width: 100%; height: 100%; object-fit: contain;
  }
  .title {
    position: absolute; top: 22px; left: 32px;
    color: #3898EC; font-size: 26px; font-weight: bold;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
  .specs {
    position: absolute; top: 56px; left: 32px;
    color: #d4a514; font-size: 15px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
  }

  /* Hub inset */
  .hub-inset {
    position: absolute; bottom: 20px; right: 20px;
    width: 300px; background: #0d1117;
    border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
    overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }
  .hub-inset img { width: 100%; display: block; }
  .hub-inset .hub-title {
    background: rgba(0,0,0,0.7); color: #d4a514;
    font-size: 12px; font-weight: bold; padding: 6px 10px;
    text-align: center;
  }
  .hub-inset .hub-labels {
    padding: 8px 10px; font-size: 11px; line-height: 1.8;
  }
  .hub-inset .hub-labels .item {
    display: flex; align-items: center; gap: 8px;
  }
  .hub-inset .swatch {
    width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0;
  }

  /* Callouts on main image */
  .callout {
    position: absolute; display: flex; align-items: center;
  }
  .callout .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.7); flex-shrink: 0;
  }
  .callout .line {
    width: 40px; height: 1px; background: rgba(255,255,255,0.3);
  }
  .callout .label {
    background: rgba(0,0,0,0.82); color: #f0f0f0;
    padding: 5px 12px; border-radius: 4px; font-size: 14px;
    font-weight: bold; white-space: nowrap;
    border-left: 3px solid;
  }
</style>
</head>
<body>
<div class="container">
  <img class="main" src="renders/rotor_clean.png?v=6" alt="">

  <div class="title">SINGLE AUTOGYRO ROTOR UNIT</div>
  <div class="specs">R=3.0 m  &middot;  2 blades  &middot;  150 mm chord  &middot;  Dyneema SK99</div>

  <!-- Hub close-up inset -->
  <div class="hub-inset">
    <div class="hub-title">HUB ASSEMBLY &mdash; close-up</div>
    <img src="renders/hub_closeup.png" alt="">
    <div class="hub-labels">
      <div class="item"><span class="swatch" style="background:#d4a514"></span> Top molding</div>
      <div class="item"><span class="swatch" style="background:#bbb"></span> Top bearing &mdash; SKF 51105</div>
      <div class="item"><span class="swatch" style="background:#888"></span> Rotor hub &mdash; aluminium</div>
      <div class="item"><span class="swatch" style="background:#bbb"></span> Bottom bearing</div>
      <div class="item"><span class="swatch" style="background:#d4a514"></span> Bottom molding</div>
      <div class="item"><span class="swatch" style="background:#555"></span> Central tube &mdash; carbon fibre</div>
      <div class="item"><span class="swatch" style="background:#3898EC"></span> Dyneema SK99 line</div>
    </div>
  </div>
</div>
</body>
</html>
